# Everything this repository knows how to check, on every push.
#
# The project's main asset is its measurements, and until this file existed not
# one of them ran unless somebody remembered to run it. That is how a suite
# rots: not by failing, but by nobody running the half that takes longest.
# bench/scripts/suite.sh says exactly that about itself, and then sat behind a
# person typing it.
#
# The tiers mirror suite.sh's, because the split is real: what needs nothing,
# what needs a chart toolchain, and what needs a running PostgreSQL 17 with a
# standby. They are separate jobs so that a missing PGDG package cannot be
# mistaken for a broken mirror.
#
# INCOMPLETE IS NOT A PASS. suite.sh exits 2 when a section could not run, and
# this workflow preserves that distinction rather than flattening it to success
# — a CI run that reports a skipped section as green is how a benchmark comes to
# measure nothing.
#
# That rule is also what produced the `serving` job below. The serving section
# needs a pg_duckdb that is not packaged anywhere — v1.1.1 plus this
# repository's confinement patch — so for weeks it reported INCOMPLETE and took
# the whole run down with it. There were two ways out: stop asking, or build the
# thing. It builds the thing.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. no database, no cluster -------------------------------------------
  test:
    name: unit, race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: build
        run: go -C go build ./...

      - name: vet
        run: go -C go vet ./...

      - name: test
        run: go -C go test ./... -count=1

      # The race detector earns its runtime here specifically: the apply
      # goroutine and the background compactor share a manifest, and the bugs
      # that come from getting that wrong do not fail a test, they produce a
      # mirror that answers with a superseded value.
      - name: race
        run: go -C go test ./internal/mirror ./cmd/qs-mirror -race -count=1

      # The escape hatches have to keep working or they are not escape hatches.
      # Each of these flags is the documented recovery from a halt or a
      # regression, and a recovery path that only runs when someone remembers is
      # not a recovery path.
      - name: every feature flag off
        run: |
          env QS_TEMPORAL_TYPES=0 QS_PARTIAL_DELTAS=0 QS_ELIDE_UNCHANGED=0 \
              QS_SNAPPY_DELTAS=1 QS_MAX_TICK_CHANGES=0 QS_MAX_MERGE_FILES=0 \
              go -C go test ./internal/mirror -count=1

  # ---- 2. the CNPG-I handshake, without Kubernetes --------------------------
  # A SEPARATE module on purpose: testing the handshake means importing the
  # CloudNativePG operator, which must not reach a shipping binary's dependency
  # tree. Hence its own job and its own -C.
  cnpgi:
    name: cnpg-i fidelity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/fidelity/go.mod
          cache-dependency-path: go/fidelity/go.sum
      - name: test
        run: go -C go/fidelity test ./... -count=1

  # ---- 3. what we would apply to a cluster, without a cluster ---------------
  manifests:
    name: chart and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: install kubeconform
        run: |
          ver=0.6.7
          curl -sSLo /tmp/kc.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${ver}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: helm lint
        run: helm lint charts/quicksilver

      # kubeconform against the real Kubernetes schemas, and the example Cluster
      # against CloudNativePG's published CRD. helm lint checks only that the
      # templates render; neither of those is what it does.
      - name: validate manifests
        run: bash bench/scripts/validate_manifests.sh

  # ---- 4. the images build ---------------------------------------------------
  # Not pushed — built. A Dockerfile that has stopped building is something to
  # learn about on the commit that broke it, not from a release workflow at the
  # moment somebody is trying to cut a version.
  images:
    name: images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: plugin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: plugin
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: mirror
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: mirror
          push: false
          cache-from: type=gha

  # ---- 5. against a real PostgreSQL 17 --------------------------------------
  # The correctness sections need a primary, a standby and a logical slot, so
  # they need a real cluster rather than a service container: the scripts run
  # pg_ctl and pg_basebackup themselves.
  #
  # PostgreSQL 17 is not optional. On 16 a failover loses the logical slot
  # outright (docs/14, docs/15), which is why the plugin refuses to run
  # `ingest: logical` below 17 — so testing against whatever the runner ships
  # would be testing a configuration this project rejects.
  integration:
    name: against PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: install PostgreSQL 17
        run: |
          sudo systemctl stop postgresql || true
          curl -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17
          /usr/lib/postgresql/17/bin/postgres --version

      # The suite runs its own manifests section, so this job needs the chart
      # tooling too. Without it that section reported "FAIL manifests (exit 1)",
      # which reads as a broken chart and was a missing binary — the standalone
      # `manifests` job above passed on the same commit, which is what made the
      # contradiction visible.
      - uses: azure/setup-helm@v4
      - name: install kubeconform
        run: |
          ver=0.6.7
          curl -sSLo /tmp/kc.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${ver}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: python deps
        run: pip install --quiet duckdb psycopg[binary]

      # Correctness only. The performance sections are opt-in (FULL=1) because
      # a shared CI runner cannot produce a number worth publishing — and a
      # benchmark whose numbers nobody trusts is worse than no benchmark.
      # `|| rc=$?`, not `rc=$?` on the next line: GitHub runs each step under
      # `bash -e`, so a failing suite would abort the step before the exit code
      # could be read and the INCOMPLETE case would never be reported as such.
      #
      # SKIP=serving, and the `serving` job below is the whole reason that is
      # allowed. Building the patched pg_duckdb takes about an hour on a cold
      # cache; making this ten-minute job wait for it would mean nobody sees a
      # unit-test failure until the extension has finished compiling. The
      # section is not dropped, it is moved, and suite.sh prints and counts
      # what SKIP removed so this run cannot be mistaken for a whole one.
      # `sudo -E env SKIP=…`, not a step-level env: — -E asks sudo to preserve
      # the environment and sudoers decides whether it may. env(1) sets the
      # variable in the child itself, which nothing can decline.
      - name: suite
        run: |
          rc=0
          sudo -E env SKIP=serving bash bench/scripts/suite.sh || rc=$?
          if [ "$rc" = "2" ]; then
            echo "::error::the suite reported INCOMPLETE - a section could not run, which is not a pass: it told us nothing."
          fi
          exit "$rc"

      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: /tmp/qs-suite/
          if-no-files-found: ignore
          retention-days: 7

  # ---- 6. answering a SELECT through PostgreSQL 17 --------------------------
  # Its own job because of its own dependency: pg_duckdb v1.1.1 plus
  # bench/patches/pg_duckdb-allowed-directories.patch, which is not packaged
  # anywhere and has to be compiled — DuckDB included. That is roughly an hour
  # the first time and nothing at all afterwards, because the built extension is
  # cached on the patch's own hash: change the patch and it rebuilds, touch
  # anything else and it does not.
  #
  # Every other section queries the mirror with DuckDB directly, which proves
  # the Parquet is right and proves nothing about whether an ordinary role can
  # reach it from the database they already have a connection to. This is the
  # only place that question is asked.
  #
  # The section itself takes about 20 SECONDS after an hour of building, which
  # looks wrong and is not: it loads 200k rows on purpose, because at that size
  # everything is in shared_buffers and any timing would be noise. It still
  # builds a primary, a standby, a mirror and a view, reads it back as an
  # unprivileged role, and proves eight things are denied. serving_pg17.sh's
  # own section 9 skips the performance comparison below 1M rows and says so.
  serving:
    name: serving through PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: install PostgreSQL 17 and its headers
        run: |
          sudo systemctl stop postgresql || true
          curl -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-server-dev-17
          /usr/lib/postgresql/17/bin/postgres --version

      # Keyed on the patch, the upstream tag and the PostgreSQL major, because
      # those are the only three things that change what comes out. The cached
      # object is ~130MB (pg_duckdb.so and the libduckdb.so it links against),
      # and it is read on every push, so GitHub's least-recently-used eviction
      # leaves it alone.
      - name: the patched extension, if it has been built before
        id: ext
        uses: actions/cache@v4
        with:
          path: /tmp/pgduck-stage
          key: pgduck-v1.1.1-pg17-${{ runner.os }}-${{ hashFiles('bench/patches/pg_duckdb-allowed-directories.patch') }}

      - name: build pg_duckdb v1.1.1 with the confinement patch
        if: steps.ext.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          # DuckDB's build tree is several GB and the runner ships tens of GB of
          # toolchains this job never touches. Reclaimed before rather than
          # diagnosed after: out of disk here presents as a linker error.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost || true
          df -h / | tail -1

          # From pg_duckdb's own Dockerfile, minus the packages that are only
          # there to build PostgreSQL itself (we use the pgdg server-dev), and
          # minus libtinfo5, which does not exist on noble.
          sudo apt-get install -y -qq build-essential cmake ninja-build git \
            pkg-config ccache libssl-dev liblz4-dev libcurl4-openssl-dev zlib1g-dev

          # v1.1.1 is 7b0db3737a1ab2dfb182b742322426e3c4b500af. The submodule is
          # DuckDB v1.4.3 and is shallow: the Makefile passes
          # OVERRIDE_GIT_DESCRIBE, so DuckDB does not need the history.
          git clone --depth 1 --branch v1.1.1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/duckdb/pg_duckdb /tmp/pg_duckdb
          cd /tmp/pg_duckdb
          git apply --verbose \
            "$GITHUB_WORKSPACE/bench/patches/pg_duckdb-allowed-directories.patch"

          export PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config
          make -j"$(nproc)"

          # `install: install-duckdb` puts libduckdb.so in place with a plain
          # install(1), which does not create its directory — under DESTDIR that
          # directory does not exist yet, and PGXS's installdirs has not run.
          mkdir -p "/tmp/pgduck-stage$($PG_CONFIG --pkglibdir)" \
                   "/tmp/pgduck-stage$($PG_CONFIG --sharedir)/extension"
          make install DESTDIR=/tmp/pgduck-stage

          # The build tree is the several GB; the suite checks for free disk
          # before it will run, and it is right to.
          cd /
          rm -rf /tmp/pg_duckdb
          find /tmp/pgduck-stage -type f -printf '  %10s  %p\n'

      - name: install it, and check it is the patched build
        run: |
          set -euo pipefail
          sudo cp -a /tmp/pgduck-stage/. /
          lib=$(/usr/lib/postgresql/17/bin/pg_config --pkglibdir)
          # grep -a on the binary, not `strings | grep -q`: under pipefail that
          # pipeline reports failure on success, because grep -q exits at the
          # first match and strings dies of SIGPIPE. serving_pg17.sh has the
          # same check and the same comment, for the same reason.
          grep -qa duckdb.allowed_directories "$lib/pg_duckdb.so" \
            || { echo "::error::the built pg_duckdb has no duckdb.allowed_directories - the patch did not take"; exit 1; }
          echo "$lib/pg_duckdb.so carries duckdb.allowed_directories"

      - name: serving
        run: |
          rc=0
          sudo -E env ONLY=serving bash bench/scripts/suite.sh || rc=$?
          if [ "$rc" = "2" ]; then
            echo "::error::serving reported INCOMPLETE - it could not run, which is not a pass. This job exists to make it runnable, so an INCOMPLETE here means the extension build or install is wrong, not that the dependency is missing."
          fi
          exit "$rc"

      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serving-logs
          path: /tmp/qs-suite/
          if-no-files-found: ignore
          retention-days: 7
