# Everything this repository claims about a running cluster, on a running
# cluster.
#
# It began as the two claims no sandbox in this project has ever been able to
# make:
#
#   - a Pod PULLING the published images from ghcr. That needs a registry, a
#     credential, and a kubelet.
#   - a Pod being ROLLED, and a Pod being REMOVED from a Service because the
#     mirror's readiness probe failed. That needs a kubelet that can create pod
#     sandboxes, which needs CAP_SYS_RESOURCE: runc sets a sandbox's
#     oom_score_adj to -998, and a process may only RAISE it without that
#     capability. docs/21 has the full diagnosis.
#
# A GitHub-hosted runner has both — cgroup v2, full capabilities, and a
# GITHUB_TOKEN that can read this repository's packages. So the things that are
# impossible in development are ordinary here, and that is the whole reason this
# workflow exists.
#
# Since then the project gained a slot per Pod, a DuckLake, an extension inside
# PostgreSQL that routes reads, per-table halts and an operand image, and each
# of them was validated on one host with one standby. bench/scripts/
# cluster_e2e.sh now asserts all of it on three instances; its header lists the
# eleven sections.
#
# WHEN IT RUNS, and why each trigger is what it is:
#
#   pull_request  to the default branch, when the change touches something that
#                 ends up in a Pod. This is the trigger that makes a pull
#                 request's green mean "it works on a cluster". It is path
#                 filtered because the run is about forty-five minutes: a
#                 change to docs/ or a README does not start it.
#   push          to the default branch only, same paths: the merge commit is
#                 not the commit the pull request tested.
#   workflow_run  after a release: the PUBLISHED artifacts.
#   schedule      weekly, so the answer does not go stale between releases.
#   dispatch      on demand, either kind.
#
# The trigger decides WHICH IMAGES, and the distinction matters more than it
# looks. A pull request or a push is asking whether THIS COMMIT works, so it
# builds the checkout and side-loads it. A release or the schedule is asking
# whether the SHIPPED ARTIFACTS work, so it pulls them. Getting that backwards
# produces a green run about the wrong thing.
#
# WHAT CHANGED IN THE TRIGGERS, said plainly because two of these were
# safeguards:
#
#   - `push` used to fire on every branch. With `pull_request` added, a push to
#     a branch that has a pull request open would start two identical runs, so
#     push is now the default branch only. A branch with no pull request no
#     longer gets a cluster run by pushing; `workflow_dispatch` with
#     images=source is how to ask for one.
#   - The concurrency group used to be ONE for the whole repository (see below
#     for why). It still is for everything except pull requests, which get a
#     group each: with a single group and cancel-in-progress, opening a second
#     pull request would cancel the first one's run, and a pull request could
#     cancel the verification of a release.
#   - A standing cluster (the KUBECONFIG secret) is never used by a pull
#     request. That step used to have no such condition because pull requests
#     did not run this workflow; they do now, and a pull request's code must not
#     be pointed at a cluster that outlives the run.

name: cluster-e2e

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to pull, e.g. 0.0.3"
        required: true
        # Clicking "Run workflow" and changing nothing should test the newest good
        # release. This defaulted to 0.0.2, which is the one that does not start.
        default: "0.0.3"
      images:
        description: "published = test the release; source = build this checkout and load it into kind"
        required: false
        default: "published"
        type: choice
        options: [published, source]
  # What ends up in a Pod: the three images' sources, the chart, the harness.
  # Five of the first six findings came from these files, and every one of them
  # needed somebody to remember to click Run workflow — which is how the 9187
  # collision sat in a release, and how a fix for it then waited on a human
  # between every attempt.
  #
  # The `!` lines come last and win: Markdown anywhere, and the extension's
  # recorded validation results, are not in any image.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cluster-e2e.yml"
      - "bench/scripts/cluster_e2e.sh"
      - "bench/scripts/lib_slotname.sh"
      - "deploy/**"
      - "charts/quicksilver/**"
      - "go/go.mod"
      - "go/go.sum"
      - "go/internal/**"
      - "go/cmd/quicksilver-plugin/**"
      - "go/cmd/qs-mirror/**"
      - "go/cmd/qs-verify/**"
      - "go/cmd/qs-query/**"
      - "ext/pg_quicksilver/**"
      - "!**/*.md"
      - "!**/*_test.go"
      - "!ext/pg_quicksilver/validate/**"
      - "!ext/pg_quicksilver/sql/**"
      - "!ext/pg_quicksilver/expected/**"
  # The same list, written out: a YAML anchor would say it once, and the
  # workflow linter this repository runs does not accept one here. ci.yml's
  # lint job fails if the two lists ever differ.
  push:
    branches: [main]
    paths:
      - ".github/workflows/cluster-e2e.yml"
      - "bench/scripts/cluster_e2e.sh"
      - "bench/scripts/lib_slotname.sh"
      - "deploy/**"
      - "charts/quicksilver/**"
      - "go/go.mod"
      - "go/go.sum"
      - "go/internal/**"
      - "go/cmd/quicksilver-plugin/**"
      - "go/cmd/qs-mirror/**"
      - "go/cmd/qs-verify/**"
      - "go/cmd/qs-query/**"
      - "ext/pg_quicksilver/**"
      - "!**/*.md"
      - "!**/*_test.go"
      - "!ext/pg_quicksilver/validate/**"
      - "!ext/pg_quicksilver/sql/**"
      - "!ext/pg_quicksilver/expected/**"
  workflow_run:
    workflows: ["release"]
    types: [completed]
  schedule:
    # Sunday 04:00 UTC. A weekly run catches the case this whole workflow is
    # about: something that works today and quietly stops working later,
    # because nothing in the ordinary loop touches a registry or a kubelet.
    - cron: "0 4 * * 0"

permissions:
  contents: read
  packages: read

# ONE cluster at a time, repo-wide, and the newest commit wins.
#
# The push trigger above makes it easy to have several of these in flight at
# once — a branch push and a fast-forward of main are two commits seconds apart,
# and each starts a twenty-five minute job that builds a kind cluster and two
# operators. Bounding that is worth doing on its own merits.
#
# CORRECTION, recorded because the commit that added this block got it wrong.
# It blamed the pile-up for two jobs that failed in four seconds without a
# runner. That was a plausible reading and it was not the cause: with this group
# in place the very next two runs failed identically, and so did every job of
# every OTHER workflow — six CI jobs, three to four seconds each, no steps, no
# runner. A run sixteen minutes earlier had completed normally on the same
# workflow file. The fault was account-wide, nothing to do with concurrency or
# with the code. This block stays because it is right; the reason first given
# for it was not.
#
# The account-wide fault has since been named, by GitHub, in a CHECK-RUN
# ANNOTATION rather than a job log — which is why six days went into inferring
# it. There is no job log to read when the job never starts. See HANDOFF.md for
# the one-line curl that reads it.
#
# Deliberately NOT keyed on github.ref. Keying per ref is the usual choice and
# would not have helped here, because the pile-up was the same tree arriving on
# two refs. A single group bounds the cost at one cluster, and cancelling the
# older run is right for a test whose whole question is "does the current commit
# work".
#
# The one exception is a pull request, which is keyed on its number: the
# newest push to a pull request cancels that pull request's older run and
# nobody else's. Everything else still shares the one group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cluster-e2e-pr-{0}', github.event.pull_request.number) || 'cluster-e2e' }}
  cancel-in-progress: true

jobs:
  cluster:
    name: three instances, on a real cluster
    runs-on: ubuntu-latest
    # The full run is about forty-five minutes on a four-core runner: ten for
    # the images, five for the operators, thirty for the sections. Every wait
    # in the script is bounded, so a run that fails does so well inside this;
    # the limit is for a runner that has stopped making progress.
    timeout-minutes: 90
    # workflow_run fires on `completed`, which includes FAILED. Without this a
    # release that failed to publish would start a published-mode run anyway,
    # which resolves "the newest chart the registry holds" — the PREVIOUS
    # version — and tests it again. That run would be about the wrong artifact:
    # green would mean the old release still works, red would look like the new
    # one is broken. Neither is the question. Every other trigger is unaffected.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # Prove the host can do what the development sandbox cannot, and say so in
      # the log. When this workflow fails, the first question will be whether
      # the runner was capable, and this answers it before anything else runs.
      - name: the runner can create pod sandboxes
        run: |
          echo "cgroup: $(stat -fc %T /sys/fs/cgroup)"
          awk '/CapBnd/ {print "CapBnd: " $2}' /proc/self/status
          # bit 24 is CAP_SYS_RESOURCE; on the dev sandbox it is clear and no
          # pod sandbox can be created at all.
          python3 - <<'PY'
          bnd = int(open('/proc/self/status').read().split('CapBnd:')[1].split()[0], 16)
          print("CAP_SYS_RESOURCE:", "present" if bnd >> 24 & 1 else "ABSENT")
          PY

      # WHICH IMAGES, decided once and printed.
      #
      # This used to be read straight off github.event.inputs.images, which is
      # empty for every trigger except workflow_dispatch — so adding the push
      # trigger above would have made a push quietly test the PUBLISHED release
      # instead of the commit that triggered it. Green, and about the wrong
      # artifact, which is the worst outcome available here.
      #
      # push, pull_request -> source:    the question is "does THIS work".
      # else               -> published: a release, the schedule, or an
      #                       explicit dispatch is asking whether the shipped
      #                       artifacts work.
      - name: which images are under test
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.images }}" ]; then
            m="${{ github.event.inputs.images }}"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            m="source"
          else
            m="published"
          fi
          echo "images=$m" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} -> images=$m"

      # Two ways to get a cluster, and the choice is a real one.
      #
      # kind, by default: free, ephemeral, and rebuilt per run — so a green run
      # says the whole path works from nothing, which is what you want to know
      # after a release.
      #
      # A standing cluster, when the KUBECONFIG secret is set: any managed
      # Kubernetes (Civo, DigitalOcean, Linode, GKE — a single small node is
      # enough). Use it when the question is what happens OVER TIME — a mirror
      # that has been streaming for a week, a rollout watched across versions,
      # a slot that has been pinning WAL since Tuesday. kind is destroyed before
      # any of that can be observed.
      #
      # Set it with:  gh secret set KUBECONFIG < ~/.kube/config
      #
      # Never for a pull request. A standing cluster outlives the run and is
      # shared; a pull request's code is the thing under test, not yet trusted
      # with either. The secret is not even read for that event.
      - name: use the standing cluster, if one is configured
        id: kube
        env:
          KUBECONFIG_SECRET: ${{ github.event_name != 'pull_request' && secrets.KUBECONFIG || '' }}
        run: |
          if [ -n "$KUBECONFIG_SECRET" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s' "$KUBECONFIG_SECRET" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
            echo "standing=true" >> "$GITHUB_OUTPUT"
            echo "using the cluster from the KUBECONFIG secret"
          else
            echo "standing=false" >> "$GITHUB_OUTPUT"
            echo "no KUBECONFIG secret; a kind cluster will be created"
          fi

      - uses: helm/kind-action@v1
        if: steps.kube.outputs.standing != 'true'
        with:
          cluster_name: qs
          wait: 120s

      # Skipped in source mode, where there is no version to pull and this step
      # would `exit 1` for failing to find one. It asks the registry what the
      # newest published chart is, which is a question only the published path
      # has.
      - name: the version to pull
        id: v
        if: steps.mode.outputs.images != 'source'
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            # Triggered by a release or the schedule: take the newest chart
            # version the registry actually holds, rather than guessing.
            v=$(helm show chart oci://ghcr.io/${{ github.repository_owner }}/charts/quicksilver \
                  2>/dev/null | awk '/^version:/{print $2}')
          fi
          v="${v#v}"
          [ -n "$v" ] || { echo "::error::could not determine a version to pull"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pulling $v"

      # Build this checkout instead of pulling the release.
      #
      # Without this the job could only ever test the PUBLISHED images, so a fix
      # to the sidecar was untestable until it had been released — which is how
      # a log-noise fix sat in main through a whole run that still showed the
      # old behaviour, and how the 9187 port collision would have needed a
      # release to verify. Iterating on a product bug through a release cycle is
      # not iterating.
      #
      # `published` stays the default because verifying the release is this
      # workflow's other job.
      - name: build this checkout's three images
        if: steps.mode.outputs.images == 'source'
        timeout-minutes: 30
        run: |
          docker build --target plugin -t localhost/qs/pg_quicksilver-plugin:dev -f deploy/Dockerfile .
          docker build --target mirror -t localhost/qs/pg_quicksilver-mirror:dev -f deploy/Dockerfile .
          # The operand image: CloudNativePG's PostgreSQL 17 with pg_duckdb,
          # pg_quicksilver and DuckDB's extensions. Its last build stage is a
          # test with the network off (deploy/duckdb-extensions.sh verify), so
          # this line failing usually means that, and the log says where.
          #
          # 17-dev, not dev: CloudNativePG reads the PostgreSQL major from the
          # front of an image tag, and refuses a Cluster whose tag has none.
          docker build --target postgres -t localhost/qs/pg_quicksilver-postgres:17-dev -f deploy/Dockerfile .

      # The images, asked directly, before a cluster is involved: a mistake
      # here would otherwise surface as a Pod that does not start, twenty
      # minutes later and looking like Kubernetes.
      - name: the images are what a Pod needs them to be
        if: steps.mode.outputs.images == 'source'
        run: |
          set -euo pipefail
          for i in mirror:dev postgres:17-dev; do
            u=$(docker image inspect "localhost/qs/pg_quicksilver-$i" --format '{{.Config.User}}')
            echo "$i runs as $u"
            # UID 26 is CloudNativePG's postgres. The sidecar writes the files
            # PostgreSQL reads; anyone else and the mirror is unreadable.
            case "$u" in 26|26:26) ;; *) echo "::error::the $i image runs as '$u', not 26"; exit 1 ;; esac
          done
          # The tools an operator runs INSIDE the Pod are in the mirror image.
          for b in qs-verify qs-query; do
            docker run --rm --entrypoint "/$b" localhost/qs/pg_quicksilver-mirror:dev -h 2>&1 | head -2
            docker run --rm --entrypoint "/$b" localhost/qs/pg_quicksilver-mirror:dev -h 2>&1 | grep -q "Usage of /$b" \
              || { echo "::error::/$b is not in the mirror image"; exit 1; }
          done
          # CloudNativePG supplies the entrypoint; an image that sets one
          # breaks the instance manager.
          ep=$(docker image inspect localhost/qs/pg_quicksilver-postgres:17-dev --format '{{json .Config.Entrypoint}}')
          [ "$ep" = "null" ] || { echo "::error::the operand image sets an ENTRYPOINT ($ep); CloudNativePG's images do not"; exit 1; }
          echo "--- what the image build verified, with the network off:"
          docker run --rm --network=none localhost/qs/pg_quicksilver-postgres:17-dev cat /usr/share/quicksilver/verified.txt
          # And again now, as a Pod will run it: no network, a READ-ONLY root
          # filesystem, UID 26. The build proved the files are enough; this
          # proves the finished image did not lose them.
          docker run --rm --network=none --read-only --tmpfs /tmp \
            -e PRELOAD=pg_duckdb,pg_quicksilver localhost/qs/pg_quicksilver-postgres:17-dev \
            qs-duckdb-extensions verify /usr/lib/quicksilver/duckdb-extensions

      # Build this checkout instead of pulling the release.
      #
      # Without this the job could only ever test the PUBLISHED images, so a fix
      # to the sidecar was untestable until it had been released — which is how
      # a log-noise fix sat in main through a whole run that still showed the
      # old behaviour, and how the 9187 port collision would have needed a
      # release to verify. Iterating on a product bug through a release cycle is
      # not iterating.
      - name: load them into kind
        if: steps.mode.outputs.images == 'source'
        run: |
          # A SECOND tag on the same image, for the roll. The roll section
          # proves the operator replaces Pods when sidecarImage changes, so it
          # needs a reference that differs from the running one AND that the
          # kubelet can obtain. Pulling, it used :latest from ghcr; side-loaded,
          # nothing had ever put :latest on the node, so the Pods went to
          # ImagePullBackOff and the section timed out reporting that no Pod
          # was replaced.
          #
          # Not :latest deliberately: Kubernetes defaults that tag's
          # imagePullPolicy to Always, which ignores the node's copy and tries
          # the registry anyway.
          docker tag localhost/qs/pg_quicksilver-mirror:dev \
                     localhost/qs/pg_quicksilver-mirror:dev-rolled

          kind load docker-image --name qs \
            localhost/qs/pg_quicksilver-plugin:dev \
            localhost/qs/pg_quicksilver-mirror:dev \
            localhost/qs/pg_quicksilver-mirror:dev-rolled \
            localhost/qs/pg_quicksilver-postgres:17-dev

      # The pull, on its own, before any cluster is involved. If this fails the
      # cluster test below would fail for a reason that looks like Kubernetes,
      # so it is separated out. Skipped when testing source, where there may be
      # no published build of what is being tested.
      - name: the published artifacts can be PULLED
        if: steps.mode.outputs.images != 'source'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm pull "oci://ghcr.io/${{ github.repository_owner }}/charts/quicksilver" --version "$V"
          ls -la quicksilver-*.tgz

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/${{ github.repository }}-plugin:$V"
          docker pull "ghcr.io/${{ github.repository }}-mirror:$V"
          # The operand image exists from the first release after 0.0.3. The
          # same rule is in cluster_e2e.sh (SCOPE): a release that has one is
          # asked to route, and one that does not is not failed for lacking it.
          case "$V" in
            0.0.[0-3]) echo "$V predates the operand image; the cluster run below is in legacy scope" ;;
            *) docker pull "ghcr.io/${{ github.repository }}-postgres:17-$V"
               docker image inspect "ghcr.io/${{ github.repository }}-postgres:17-$V" \
                 --format 'postgres runs as {{.Config.User}}' ;;
          esac

          # Pulled AND runnable. The mirror image ships qs-verify; if the image
          # is broken this is where it shows, not three steps later.
          docker run --rm --entrypoint /qs-verify \
            "ghcr.io/${{ github.repository }}-mirror:$V" -h 2>&1 | head -3 || true
          docker image inspect "ghcr.io/${{ github.repository }}-mirror:$V" \
            --format 'mirror runs as {{.Config.User}}'
          docker image inspect "ghcr.io/${{ github.repository }}-plugin:$V" \
            --format 'plugin runs as {{.Config.User}}'

      - name: the cluster test
        timeout-minutes: 70
        env:
          KUBECONFIG: /home/runner/.kube/config
          # In source mode the images are already on the node, so there is
          # nothing to pull and no secret to pull it with: LOCAL_IMAGES=1 makes
          # the script say so in its own output rather than quietly proving
          # something weaker than it claims.
          VERSION: ${{ steps.mode.outputs.images == 'source' && 'dev' || steps.v.outputs.version }}
          REGISTRY: ${{ steps.mode.outputs.images == 'source' && 'localhost/qs' || format('ghcr.io/{0}', github.repository_owner) }}
          LOCAL_IMAGES: ${{ steps.mode.outputs.images == 'source' && '1' || '0' }}
          # Empty in published mode, where the script's own default (:latest on
          # ghcr) is right and reachable.
          ROLL_IMAGE: ${{ steps.mode.outputs.images == 'source' && 'localhost/qs/pg_quicksilver-mirror:dev-rolled' || '' }}
          # SCOPE is left to the script: full for a checkout and for any
          # release that has an operand image, legacy for 0.0.3 and earlier.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: /tmp/qs-cluster-e2e
        run: bash bench/scripts/cluster_e2e.sh

      # The script writes its own diagnostics on the way out. This is for the
      # run it could not: one that was cancelled or timed out mid-wait.
      - name: what the cluster looked like, if it did not work
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/qs-cluster-e2e
          {
          kubectl get pods -A -o wide || true
          kubectl -n qs-e2e describe cluster app || true
          kubectl -n cnpg-system logs deploy/quicksilver --tail=100 || true

          # Run 3 was CrashLoopBackOff on app-1 and this step could not say
          # WHICH container was crashing, because it only fetched the mirror's
          # log. describe carries Last State, Exit Code and Reason per
          # container, which is the first thing worth reading.
          kubectl -n qs-e2e describe pod -l cnpg.io/podRole=instance || true

          # PostgreSQL's own log, current and previous. A crash loop means the
          # useful output is in the PREVIOUS container, which is gone from the
          # running one.
          for c in postgres quicksilver-mirror; do
            echo "=== $c (current) ==="
            kubectl -n qs-e2e logs -l cnpg.io/podRole=instance -c "$c" --tail=60 --prefix || true
            echo "=== $c (previous, the one that crashed) ==="
            kubectl -n qs-e2e logs -l cnpg.io/podRole=instance -c "$c" --previous --tail=60 --prefix || true
          done
          } 2>&1 | tee /tmp/qs-cluster-e2e/after-failure.txt

      # Per Pod and per container: both logs in full, the sidecar's /metrics
      # and /readyz, quicksilver.mirror_status(), every replication slot, the
      # Cluster as the API server holds it, and the operator's and plugin's
      # logs. A failure in a forty-five minute run should not need a second run
      # to read.
      - name: keep the logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-e2e-${{ steps.mode.outputs.images }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qs-cluster-e2e/
          if-no-files-found: warn
          retention-days: 14

      # A standing cluster is shared and outlives the run, so the test's
      # namespace must not. kind is thrown away and needs no such care.
      - name: leave the standing cluster as it was found
        if: always() && steps.kube.outputs.standing == 'true'
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: kubectl delete namespace qs-e2e --ignore-not-found --wait=false
