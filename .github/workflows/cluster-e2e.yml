# The two claims no sandbox in this project has ever been able to make.
#
# Everything else runs where the code is developed. These two cannot:
#
#   - a Pod PULLING the published images from ghcr. That needs a registry, a
#     credential, and a kubelet.
#   - a Pod being ROLLED, and a Pod being REMOVED from a Service because the
#     mirror's readiness probe failed. That needs a kubelet that can create pod
#     sandboxes, which needs CAP_SYS_RESOURCE: runc sets a sandbox's
#     oom_score_adj to -998, and a process may only RAISE it without that
#     capability. docs/21 has the full diagnosis.
#
# A GitHub-hosted runner has both — cgroup v2, full capabilities, and a
# GITHUB_TOKEN that can read this repository's packages. So the things that are
# impossible in development are ordinary here, and that is the whole reason this
# workflow exists.
#
# It is NOT on push. It builds a cluster, installs two operators and pulls
# images; that is minutes of runner time and it is not what an ordinary commit
# needs. It runs on a release, on demand, and weekly so that the answer does not
# go stale between releases.

name: cluster-e2e

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to pull, e.g. 0.0.2"
        required: true
        default: "0.0.2"
      images:
        description: "published = test the release; source = build this checkout and load it into kind"
        required: false
        default: "published"
        type: choice
        options: [published, source]
  workflow_run:
    workflows: ["release"]
    types: [completed]
  schedule:
    # Sunday 04:00 UTC. A weekly run catches the case this whole workflow is
    # about: something that works today and quietly stops working later,
    # because nothing in the ordinary loop touches a registry or a kubelet.
    - cron: "0 4 * * 0"

permissions:
  contents: read
  packages: read

jobs:
  cluster:
    name: pull, run, roll and gate, on a real cluster
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Prove the host can do what the development sandbox cannot, and say so in
      # the log. When this workflow fails, the first question will be whether
      # the runner was capable, and this answers it before anything else runs.
      - name: the runner can create pod sandboxes
        run: |
          echo "cgroup: $(stat -fc %T /sys/fs/cgroup)"
          awk '/CapBnd/ {print "CapBnd: " $2}' /proc/self/status
          # bit 24 is CAP_SYS_RESOURCE; on the dev sandbox it is clear and no
          # pod sandbox can be created at all.
          python3 - <<'PY'
          bnd = int(open('/proc/self/status').read().split('CapBnd:')[1].split()[0], 16)
          print("CAP_SYS_RESOURCE:", "present" if bnd >> 24 & 1 else "ABSENT")
          PY

      # Two ways to get a cluster, and the choice is a real one.
      #
      # kind, by default: free, ephemeral, and rebuilt per run — so a green run
      # says the whole path works from nothing, which is what you want to know
      # after a release.
      #
      # A standing cluster, when the KUBECONFIG secret is set: any managed
      # Kubernetes (Civo, DigitalOcean, Linode, GKE — a single small node is
      # enough). Use it when the question is what happens OVER TIME — a mirror
      # that has been streaming for a week, a rollout watched across versions,
      # a slot that has been pinning WAL since Tuesday. kind is destroyed before
      # any of that can be observed.
      #
      # Set it with:  gh secret set KUBECONFIG < ~/.kube/config
      - name: use the standing cluster, if one is configured
        id: kube
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_SECRET" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s' "$KUBECONFIG_SECRET" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
            echo "standing=true" >> "$GITHUB_OUTPUT"
            echo "using the cluster from the KUBECONFIG secret"
          else
            echo "standing=false" >> "$GITHUB_OUTPUT"
            echo "no KUBECONFIG secret; a kind cluster will be created"
          fi

      - uses: helm/kind-action@v1
        if: steps.kube.outputs.standing != 'true'
        with:
          cluster_name: qs
          wait: 120s

      - name: the version to pull
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            # Triggered by a release or the schedule: take the newest chart
            # version the registry actually holds, rather than guessing.
            v=$(helm show chart oci://ghcr.io/${{ github.repository_owner }}/charts/quicksilver \
                  2>/dev/null | awk '/^version:/{print $2}')
          fi
          v="${v#v}"
          [ -n "$v" ] || { echo "::error::could not determine a version to pull"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pulling $v"

      # Build this checkout instead of pulling the release.
      #
      # Without this the job could only ever test the PUBLISHED images, so a fix
      # to the sidecar was untestable until it had been released — which is how
      # a log-noise fix sat in main through a whole run that still showed the
      # old behaviour, and how the 9187 port collision would have needed a
      # release to verify. Iterating on a product bug through a release cycle is
      # not iterating.
      #
      # `published` stays the default because verifying the release is this
      # workflow's other job.
      - name: build this checkout and load it into kind
        if: github.event.inputs.images == 'source'
        run: |
          docker build --target plugin -t localhost/qs/pg_quicksilver-plugin:dev -f deploy/Dockerfile .
          docker build --target mirror -t localhost/qs/pg_quicksilver-mirror:dev -f deploy/Dockerfile .

          # A SECOND tag on the same image, for the roll. Section 4 proves the
          # operator replaces Pods when sidecarImage changes, so it needs a
          # reference that differs from the running one AND that the kubelet can
          # obtain. Pulling, it used :latest from ghcr; side-loaded, nothing had
          # ever put :latest on the node, so the Pods went to ImagePullBackOff
          # and the section timed out reporting that no Pod was replaced.
          #
          # Not :latest deliberately: Kubernetes defaults that tag's
          # imagePullPolicy to Always, which ignores the node's copy and tries
          # the registry anyway.
          docker tag localhost/qs/pg_quicksilver-mirror:dev \
                     localhost/qs/pg_quicksilver-mirror:dev-rolled

          kind load docker-image --name qs \
            localhost/qs/pg_quicksilver-plugin:dev \
            localhost/qs/pg_quicksilver-mirror:dev \
            localhost/qs/pg_quicksilver-mirror:dev-rolled
          docker image inspect localhost/qs/pg_quicksilver-mirror:dev \
            --format 'mirror runs as {{.Config.User}}'

      # The pull, on its own, before any cluster is involved. If this fails the
      # cluster test below would fail for a reason that looks like Kubernetes,
      # so it is separated out. Skipped when testing source, where there may be
      # no published build of what is being tested.
      - name: the published artifacts can be PULLED
        if: github.event.inputs.images != 'source'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm pull "oci://ghcr.io/${{ github.repository_owner }}/charts/quicksilver" --version "$V"
          ls -la quicksilver-*.tgz

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/${{ github.repository }}-plugin:$V"
          docker pull "ghcr.io/${{ github.repository }}-mirror:$V"

          # Pulled AND runnable. The mirror image ships qs-verify; if the image
          # is broken this is where it shows, not three steps later.
          docker run --rm --entrypoint /qs-verify \
            "ghcr.io/${{ github.repository }}-mirror:$V" -h 2>&1 | head -3 || true
          docker image inspect "ghcr.io/${{ github.repository }}-mirror:$V" \
            --format 'mirror runs as {{.Config.User}}'
          docker image inspect "ghcr.io/${{ github.repository }}-plugin:$V" \
            --format 'plugin runs as {{.Config.User}}'

      - name: pull, run, roll and gate
        env:
          KUBECONFIG: /home/runner/.kube/config
          # In source mode the images are already on the node, so there is
          # nothing to pull and no secret to pull it with: LOCAL_IMAGES=1 makes
          # the script say so in its own output rather than quietly proving
          # something weaker than it claims.
          VERSION: ${{ github.event.inputs.images == 'source' && 'dev' || steps.v.outputs.version }}
          REGISTRY: ${{ github.event.inputs.images == 'source' && 'localhost/qs' || format('ghcr.io/{0}', github.repository_owner) }}
          LOCAL_IMAGES: ${{ github.event.inputs.images == 'source' && '1' || '0' }}
          # Empty in published mode, where the script's own default (:latest on
          # ghcr) is right and reachable.
          ROLL_IMAGE: ${{ github.event.inputs.images == 'source' && 'localhost/qs/pg_quicksilver-mirror:dev-rolled' || '' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bench/scripts/cluster_e2e.sh

      - name: what the cluster looked like, if it did not work
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n qs-e2e describe cluster app || true
          kubectl -n cnpg-system logs deploy/quicksilver --tail=100 || true

          # Run 3 was CrashLoopBackOff on app-1 and this step could not say
          # WHICH container was crashing, because it only fetched the mirror's
          # log. describe carries Last State, Exit Code and Reason per
          # container, which is the first thing worth reading.
          kubectl -n qs-e2e describe pod -l cnpg.io/podRole=instance || true

          # PostgreSQL's own log, current and previous. A crash loop means the
          # useful output is in the PREVIOUS container, which is gone from the
          # running one.
          for c in postgres quicksilver-mirror; do
            echo "=== $c (current) ==="
            kubectl -n qs-e2e logs -l cnpg.io/podRole=instance -c "$c" --tail=60 || true
            echo "=== $c (previous, the one that crashed) ==="
            kubectl -n qs-e2e logs -l cnpg.io/podRole=instance -c "$c" --previous --tail=60 || true
          done

      # A standing cluster is shared and outlives the run, so the test's
      # namespace must not. kind is thrown away and needs no such care.
      - name: leave the standing cluster as it was found
        if: always() && steps.kube.outputs.standing == 'true'
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: kubectl delete namespace qs-e2e --ignore-not-found --wait=false
