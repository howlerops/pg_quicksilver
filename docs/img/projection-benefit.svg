<text class="ax" x="802.0" y="406" text-anchor="middle">2.0M</text>
<rect x="846.0" y="216.0" width="40.0" height="138.0" fill="var(--s3)" rx="4"/>
<text class="lbl" x="866.0" y="369.0" text-anchor="middle" fill="var(--s3)">0.06&#215;</text>
<text class="ax" x="866.0" y="406" text-anchor="middle">5.9M</text>
<text class="ax" x="802" y="426" text-anchor="middle" style="fill:var(--ink2)">live rows</text>
<text class="sub" x="20" y="452">Left: fewer columns read &#8594; more the mirror skips &#8594; bigger win, and every line rises with size as the heap stops fitting in RAM.</text>
<text class="sub" x="20" y="469">Right: the same mirror is ~16&#215; SLOWER for a single-row probe, and gets worse with scale. That is why mode: takeover is gated.</text>
</svg>
