; Item 3: transaction pooling in front of the item-3 standby (port 5664), listening on 5665.
[databases]
app = host=127.0.0.1 port=5664 dbname=app

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 5665
unix_socket_dir =
auth_type = trust
auth_file = /var/lib/postgresql/qslake2/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 8
pidfile = /var/lib/postgresql/qslake2/pgbouncer/pgbouncer.pid
logfile = /var/lib/postgresql/qslake2/pgbouncer/pgbouncer.log
admin_users = postgres
