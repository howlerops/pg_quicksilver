# A CloudNativePG Cluster with Quicksilver in shadow mode — the only mode
# Phase 1 recommends, and the one that changes nothing about how the cluster
# behaves today.
#
#   kubectl apply -f examples/cluster-shadow.yaml
#
# What this does and does not do:
#
#   DOES    build a columnar Parquet mirror of public.events and public.orders
#           on every replica, from a logical replication slot on the primary.
#   DOES    gate each replica's mirror on freshness: a mirror more than 30s
#           behind takes itself out of service rather than answering stale.
#   DOES NOT touch the -rw or -ro services. Existing traffic is unaffected.
#
# Turning it into `mode: takeover` points -ro at the mirror, which measured a
# median 935x SLOWDOWN on OLTP-shaped queries. The plugin refuses that edit
# unless acknowledgeOLTPRegression is also set; see docs/11.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app
spec:
  instances: 3

  # PostgreSQL 17 or newer is required for ingest: logical. Before 17 a logical
  # slot does not survive a failover, and recovery is a full re-snapshot of
  # every mirrored table (docs/15).
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2-standard-bookworm

  # The mirror needs a role with REPLICATION, SELECT on the mirrored tables, and
  # CREATE on the database. The superuser secret is the simplest way to get one;
  # a purpose-made role referenced by credentialsSecret is the better one.
  enableSuperuserAccess: true

  storage:
    size: 20Gi
    # The Parquet mirror lives beside PGDATA on this same volume. Measured
    # ratio: an 8.7 GB heap produced a 251 MB mirror, so budget a few percent,
    # not a doubling (docs/11).

  postgresql:
    parameters:
      # Do NOT pin wal_level here. Quicksilver sets it to logical through
      # EnrichConfiguration, and a conflicting value is rejected at admission
      # rather than silently overridden.
      shared_buffers: 512MB

      # THIS ONE IS NOT OPTIONAL, and it protects the database from the mirror.
      #
      # A logical slot pins every WAL segment its consumer has not confirmed.
      # That is what lets a restarted mirror resume instead of re-snapshotting,
      # and it means a mirror that CANNOT KEEP UP fills this primary's disk
      # until PostgreSQL stops. Measured: a 60-second workload of 11.7 million
      # row-changes against a mirror draining at about half that rate took
      # 6.6 GB of free space to 272 KB and brought the server down (docs/28).
      #
      # With this set, PostgreSQL invalidates the slot instead. The mirror
      # rebuilds from a fresh snapshot and this cluster keeps serving.
      # A quarter of the volume is a reasonable starting point.
      max_slot_wal_keep_size: 4GB

  plugins:
    - name: quicksilver.howlerops.io
      enabled: true
      parameters:
        mode: shadow
        ingest: logical
        tables: public.events,public.orders
        freshnessSLO: 30s
        database: app
        credentialsSecret: app-superuser

        # The sidecar's memory scales with the ROW COUNT of the mirrored
        # tables, not with their size on disk. Its heap is dominated by one
        # structure — the key index, one entry per live row — which a profile
        # against a 20.5M-row mirror put at 95.76% of the live heap.
        #
        # Budget about 90 bytes of RSS per live row, and round up:
        #
        #     1M rows      256Mi   (the default)
        #     5M rows      512Mi
        #    20M rows        2Gi   measured peak 1,854 MB
        #
        # This is a request AND a limit, so the sidecar is Guaranteed QoS. That
        # matters more than the number: a container that requests far less than
        # it uses is Burstable, and the Pod it makes an eviction candidate is
        # this one — the one running PostgreSQL.
        #
        # Set it too low and the mirror gets slower, not killed: the sidecar
        # runs with GOMEMLIMIT at 80% of this value, so Go collects harder
        # instead of growing past the limit. Measured at 20.5M rows, a ceiling
        # near the live heap costs 10x the drain time, so leave the headroom.
        sidecarMemory: 2Gi

  bootstrap:
    initdb:
      database: app
      owner: app
